<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.ogimage %}
    <meta property="og:image" content="{{site.url}}{{page.ogimage}}" />
    <meta property="og:title" content="{{page.title}}" />
    <meta property="og:url" content="{{site.url}}{{page.url}}" />
    <meta property="og:description" content="{{page.content}}" />
  {% endif %}
  <link href="https://fonts.googleapis.com/css?family=Indie+Flower" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  {% if page.layout == "projet" %}
    <title>Cyril Macé - {{ page.name}}</title>
  {% endif %}

  {% if page.layout != "projet" %}
    <title>Cyril Macé - {{ page.title}}</title>
  {% endif %}
  
  
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

  <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}" />
  
  {% if page.title == "accueil" %}
  <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
/>
   {% endif %}
  

</head>
